<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:
    ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <title>Table</title>
  </head>
  <style>
    /*
    SPACING SYSTEM (px)
    2 / 4 / 8 / 12 / 16 / 24 / 32 / 48 / 64 / 80 / 96 / 128

    FONT SIZE SYSTEM (px)
    10 / 12 / 14 / 16 / 18 / 20 / 24 / 30 / 36 / 44 / 52 / 62 / 74 / 86 / 98
    */

    /* Color
    Main Color- #087f5b
    Grey - #343a40
     */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Inter", sans-serif;
      color: #343a40;
      line-height: 1;
      display: flex;
      justify-content: center;
    }

    table {
      width: 800px;
      /* height: 400px; */
      margin: 100px;
      border-collapse: collapse;
      /* border: 2px solid #343a40;
      border-collapse: collapse; */
      font-size: 18px;
    }

    th,
    td {
      /* border: 1px solid #343a40; */
      padding: 15px 20px;
      text-align: left;
    }

    thead th {
      background-color: green;
      color: white;
      width: 25%;
    }

    tbody tr:nth-child(even) {
      background-color: #e9ecef;
    }

    tbody tr:nth-child(odd) {
      background-color: #f8f9fa;
    }
  </style>
  <body>
    <table class="">
      <thead>
        <tr class="">
          <th class="">Chair</th>
          <th class="">The Laid Back</th>
          <th class="">The Worker Bee</th>
          <th class="">The Chair 4/2</th>
        </tr>
      </thead>

      <tbody>
        <tr>
          <th>width</th>
          <td>80cm</td>
          <td>60cm</td>
          <td>220</td>
        </tr>
        <tr>
          <th>Height</th>
          <td>100cm</td>
          <td>110cm</td>
          <td>90cm</td>
        </tr>
        <tr>
          <th>Depth</th>
          <td>70cm</td>
          <td>65cm</td>
          <td>80cm</td>
        </tr>
        <tr>
          <th>Weight</th>
          <td>16kg</td>
          <td>22kg</td>
          <td>80kg</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
