<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:
    ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <title>Carousel</title>
  </head>
  <style>
    /*
    SPACING SYSTEM (px)
    2 / 4 / 8 / 12 / 16 / 24 / 32 / 48 / 64 / 80 / 96 / 128

    FONT SIZE SYSTEM (px)
    10 / 12 / 14 / 16 / 18 / 20 / 24 / 30 / 36 / 44 / 52 / 62 / 74 / 86 / 98
    */

    /* Color
    Main Color- #087f5b
    Grey - #343a40
     */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Inter", sans-serif;
      color: #343a40;
      line-height: 1;
    }

    img {
      width: 200px;
      height: 200px;
      border-radius: 6px;
      transform: scale(1.5);
      box-shadow: 0 10px 32px rgba(57, 46, 46, 0.5);
    }

    .carousel {
      width: 800px;
      margin: 100px auto;
      /* padding: 32px;
      padding-left: 86px;
      padding-right: 48px; */

      padding: 32px 48px 32px 86px;
      /* PADDING-Pattern:Top-Right-Bottom-Left (Clockwise) */

      background-color: #087f5b;
      border-radius: 8px;
      color: #fff;
      position: relative;

      display: flex;
      /* align-items: center; */
      gap: 86px;
    }

    .testimonial {
    }
    .testimonial-text {
      font-size: 18px;
      margin-top: 12px;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .testimonial-author {
      font-size: 14px;
      margin-bottom: 8px;
      color: #f4fae8;
    }
    .testimonial-job {
      font-size: 12px;
      margin-top: 4px;
    }

    /* CONTROLS */

    .btn {
      background-color: #fff;
      border: none;
      height: 40px;
      width: 40px;
      position: absolute;
      border-radius: 50%;
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.2);
      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn--left {
      left: 0;
      top: 50%;
      transform: translate(-50%, -50%);
    }
    .btn--right {
      right: 0;
      top: 50%;
      transform: translate(50%, -50%);
    }

    .btn-icon {
      height: 24px;
      width: 24px;
      stroke: #087f5b;
    }

    .dots {
      position: absolute;
      left: 50%;
      bottom: 0;
      transform: translate(-50%, 32px);

      display: flex;
      gap: 12px;
    }
    .dot {
      height: 16px;
      width: 16px;
      border-radius: 50%;
      background-color: #fff;
      border: 2px solid green;
      cursor: pointer;
    }

    .dot-fill {
      background-color: green;
    }
  </style>

  <body>
    <div class="carousel">
      <img src="maria.jpg" alt="Maria" />
      <blockquote class="testimonial">
        <p class="testimonial-text">
          "Lorem ipsum dolor sit amet consectetur adipisicing elit. Cumque,
          sint, id commodi hic illo voluptatibus recusandae dicta officia iusto
          neque dolor quia cum nisi provident vero facere vel earum adipisci.""
        </p>
        <p class="testimonial-author">Maria De Almedia</p>
        <p class="testimonial-job">Senior Product Manager at EDP</p>
      </blockquote>
      <button class="btn btn--left">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="btn-icon"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M15.75 19.5 8.25 12l7.5-7.5"
          />
        </svg>
      </button>
      <button class="btn btn--right">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="btn-icon"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="m8.25 4.5 7.5 7.5-7.5 7.5"
          />
        </svg>
      </button>
      <div class="dots">
        <button class="dot dot-fill">&nbsp;</button>
        <button class="dot">&nbsp;</button>
        <button class="dot">&nbsp;</button>
        <button class="dot">&nbsp;</button>
      </div>
    </div>
  </body>
</html>
